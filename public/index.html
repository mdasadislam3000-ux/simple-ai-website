<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive AI Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-10 font-sans transition-colors duration-200">

  <!-- Responsive App Card -->
  <div class="bg-white dark:bg-slate-800 shadow-xl dark:shadow-2xl rounded-2xl sm:rounded-3xl p-4 sm:p-6 md:p-8 w-full max-w-sm sm:max-w-md md:max-w-xl lg:max-w-2xl border border-slate-200 dark:border-slate-700 transition-colors duration-200">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-4 sm:mb-6 pb-3 sm:pb-4 border-b border-slate-200 dark:border-slate-700">
      <div>
        <h1 class="text-xl sm:text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">AI Studio</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">Enter a prompt to generate AI responses</p>
      </div>
      <button id="themeToggle" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
        Toggle Mode
      </button>
    </div>

    <!-- Input Section -->
    <div class="flex flex-col gap-3">
      <textarea 
        id="promptInput" 
        placeholder="Type your prompt here..." 
        class="w-full h-28 sm:h-36 p-3 sm:p-4 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:focus:ring-indigo-400 resize-y text-slate-800 dark:text-slate-100 placeholder-slate-400 text-sm sm:text-base transition"
      ></textarea>
      
      <button 
        id="generateBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 dark:bg-indigo-500 dark:hover:bg-indigo-600 text-white font-semibold py-2.5 sm:py-3 text-sm sm:text-base rounded-xl shadow-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Generate
      </button>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="hidden mt-3 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 rounded-xl text-red-600 dark:text-red-400 text-xs sm:text-sm font-medium"></div>

    <!-- Response Output Area -->
    <div class="mt-5 sm:mt-6 border-t border-slate-200 dark:border-slate-700 pt-4 sm:pt-5">
      <h2 class="text-sm sm:text-base font-semibold text-slate-800 dark:text-slate-200 mb-2">Response:</h2>
      <div 
        id="outputBox" 
        class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-3 sm:p-4 min-h-[100px] text-slate-700 dark:text-slate-300 whitespace-pre-wrap text-xs sm:text-sm md:text-base transition"
      >Your generated text will appear here...</div>
    </div>

  </div>

  <script src="script.js"></script>
  <script>
    // Simple theme switcher handler
    const themeBtn = document.getElementById('themeToggle');
    themeBtn?.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });
  </script>
</body>
</html>
